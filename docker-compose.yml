version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: achieveros_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: achieveros
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: achieveros_backend
    restart: always
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/achieveros
      SECRET_KEY: ${SECRET_KEY:-achieveros_production_secret_key_32chars}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_BASE_URL: https://integrate.api.nvidia.com/v1
      NVIDIA_CHAT_MODEL: nvidia/nemotron-4-340b-instruct
      NVIDIA_EMBEDDING_MODEL: nvidia/embed-qa-4
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: achieveros_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata:
